<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Riddle - CI/CD Pipeline Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
      border: 1px solid #334155;
    }
    h1 { margin-top: 0; color: #38bdf8; font-size: 1.8rem; }
    p { color: #94a3b8; font-size: 1rem; margin-bottom: 0; }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: #0284c7;
      color: white;
      border-radius: 9999px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Pipeline Active</div>
    <h1>Map Riddle System</h1>
    <p>Docker CI/CD Deployment is working successfully!</p>
  </div>
</body>
</html>
