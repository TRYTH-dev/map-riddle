<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>神戸・兵庫 観光クイズアプリ - マイページ</title>
  <link rel="stylesheet" href="css/mypage/style.css">
</head>
<body>
  <div class="app-container">
    <!-- ユーザープロフィール -->
    <section class="profile-card">
      <div class="profile-left">
        <div class="avatar-wrapper">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#3b82f6">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
          <span class="google-badge" title="Googleアカウント連携中">
            <svg width="12" height="12" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
            </svg>
          </span>
        </div>
        <div class="profile-info">
          <h1 id="userName">山田 太郎</h1>
          <div class="profile-email" id="userEmail">taro.yamada@gmail.com</div>
          <span class="link-status">Googleアカウント連携中</span>
        </div>
      </div>
      <button class="switch-btn" id="switchAccountBtn" title="アカウント切替">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 10l5-5 5 5M17 14l-5 5-5-5"/>
        </svg>
      </button>
    </section>

    <!-- エリア進捗一覧 -->
    <section class="areas-card" id="areasContainer"></section>
  </div>

  <!-- 解説 / 再挑戦モーダル -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">クイズ詳細</h2>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- 下部ナビゲーションバー -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">⌖</span>
      <span>マップ</span>
    </a>

    <a href="badge.html" class="nav-item">
      <span class="nav-icon">▤</span>
      <span>スタンプ履歴</span>
    </a>

    <a href="mypage.html" class="nav-item active">
      <span class="nav-icon">♙</span>
      <span>マイページ</span>
    </a>
  </nav>
<script src="script/mypage/script.js"></script>
</body>
</html>
