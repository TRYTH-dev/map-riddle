<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>観光クイズマップ</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet">
  <!-- Leaflet：地図表示 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/map/style.css">
  <script src="script/map/script.js" defer></script>
</head>

<body>
  <main class="mobile-frame">
    <!-- 地図検索エリア -->
    <section class="relative flex-1 flex flex-col min-h-0">

      <div id="map"></div>

      <!-- 現在地取得ボタン -->
      <button
        id="locate-button"
        type="button"
        title="現在地を取得して移動"
        aria-label="現在地を取得して移動"
      >
        ⌖
      </button>

    </section>

    <!-- 下部メニュー -->
    <nav class="bottom-nav">
      <a href="map.html" class="nav-item active">
        <span class="nav-icon">⌖</span>
        <span>マップ</span>
      </a>

      <a href="badge.html" class="nav-item">
        <span class="nav-icon">▤</span>
        <span>スタンプ履歴</span>
      </a>

      <a href="mypage.html" class="nav-item">
        <span class="nav-icon">♙</span>
        <span>マイページ</span>
      </a>
    </nav>

  </main>
  <!-- OpenPOI APIの出典 -->
  <footer style="display:none">
    <a href="https://openpoiapi.com/attribution.html">
      OpenPOI API
    </a>
  </footer>
</body>
</html>
