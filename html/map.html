<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>観光クイズマップ</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet">
  <!-- Leaflet：地図表示 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>

    body {
      margin: 0;
      font-family: "Meiryo", sans-serif;
      background: #f3f4f6;
    }

    .mobile-frame {
      width: 100%;
      max-width: 390px;
      height: 100dvh;
      max-height: 844px;
      margin: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      position: relative;
    }

    #map {
      width: 100%;
      flex: 1;
      min-height: 0;
      background: #e8eaed;
      z-index: 1;
    }

    /* 現在地取得ボタン（右下ズームコントロールの上に配置） */
    #locate-button {
      position: absolute;
      right: 10px;
      bottom: 86px;
      z-index: 500;
      width: 34px;
      height: 34px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      background: white;
      color: #2563eb;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
    }

    #locate-button:active {
      background: #eff6ff;
    }

    #locate-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .bottom-nav {
      height: 76px;
      flex-shrink: 0;
      border-top: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: white;
      z-index: 500;
    }

    .nav-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 12px;
    }

    .nav-item.active {
      color: #334155;
      font-weight: bold;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 1;
    }

    .leaflet-popup-content {
      line-height: 1.7;
      min-width: 150px;
    }

    .place-name {
      font-weight: bold;
      font-size: 15px;
    }

    .place-address {
      font-size: 12px;
      color: #64748b;
    }

    .place-category {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 7px;
      border-radius: 6px;
      background: #e2e8f0;
      font-size: 11px;
    }

    @media (min-width: 500px) {
      .mobile-frame {
        height: 844px;
        max-height: calc(100dvh - 32px);
        border: 5px solid #111827;
        border-radius: 32px;
      }
    }
  </style>
</head>

<body>
  <main class="mobile-frame">

    <!-- 地図検索エリア -->
    <section class="relative flex-1 flex flex-col min-h-0">

      <div id="map"></div>

      <!-- 現在地取得ボタン -->
      <button
        id="locate-button"
        type="button"
        title="現在地を取得して移動"
        aria-label="現在地を取得して移動"
      >
        ⌖
      </button>

    </section>

    <!-- 下部メニュー -->
    <nav class="bottom-nav">
      <a href="map.html" class="nav-item active">
        <span class="nav-icon">⌖</span>
        <span>マップ</span>
      </a>

      <a href="badge.html" class="nav-item">
        <span class="nav-icon">▤</span>
        <span>スタンプ履歴</span>
      </a>

      <a href="mypage.html" class="nav-item">
        <span class="nav-icon">♙</span>
        <span>マイページ</span>
      </a>
    </nav>

  </main>
  <script>
    // =====================================
    // 1. 地図を初期化（神戸周辺）
    // =====================================
    const map = L.map("map", {
      zoomControl: false
    }).setView([34.7025, 135.1955], 15);

    setTimeout(() => {
      map.invalidateSize();
    }, 300);

    // OpenStreetMapの地図画像
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">' +
        'OpenStreetMap contributors</a>'
    }).addTo(map);

    // 拡大縮小ボタン
    L.control.zoom({
      position: "bottomright"
    }).addTo(map);
 // =====================================
    // 1-2. 神戸の観光地にピンを表示
    // =====================================
    const kobeSpots = [
      { name: "神戸ポートタワー", lat: 34.6826, lng: 135.1867, url:"quiz.html"},
      { name: "メリケンパーク", lat: 34.6815, lng: 135.1892, url:"quiz.html" },
      { name: "神戸ハーバーランド umie", lat: 34.6786, lng: 135.1846, url:"quiz.html" },
      { name: "南京町", lat: 34.6882, lng: 135.1890, url:"quiz.html"},
      { name: "神戸旧居留地", lat: 34.6872, lng: 135.1920, url:"quiz.html" },
      { name: "生田神社", lat: 34.6949, lng: 135.1907,url:"quiz.html"},
      { name: "北野異人館街（風見鶏の館）", lat: 34.7014, lng: 135.1895, url:"quiz.html"},
      { name: "神戸布引ハーブ園", lat: 34.71740, lng: 135.1912, url:"quiz.html" },
      { name: "神戸どうぶつ王国", lat: 34.6545, lng: 135.2223, url:"quiz.html"},
      { name: "摩耶山 掬星台", lat: 34.7339, lng: 135.2067, url:"quiz.html"},
      { name: "六甲ガーデンテラス", lat: 34.7634, lng: 135.2464, url:"quiz.html" },
      { name: "有馬温泉", lat: 34.7973, lng: 135.2478, url:"quiz.html" },
      { name: "神戸須磨シーワールド", lat: 34.6439, lng: 135.1282, url:"quiz.html" }
    ];
   const kobeMarkers = L.layerGroup().addTo(map);
kobeSpots.forEach((spot) => {
  L.marker([spot.lat, spot.lng])
    .bindPopup(`<strong>${spot.name}</strong><br><a href="${spot.url}">クイズへ進む</a>`)
    .addTo(kobeMarkers);
});
    
    // =====================================
    // 2. PHP API設定 & 現在地（GPS）追跡
    // =====================================
    const API_URL = "api/spots.php"; // ※実ファイル名に合わせて調整してください
    const markers = L.layerGroup().addTo(map);
    let requestNumber = 0;

    const locateButton = document.getElementById("locate-button");

    let currentUserPos = null;
    let userMarker = null;
    let userRangeCircle = null;
    let firstGpsFix = true;

    function updateUserLocation(lat, lng, centerMap = false) {
      currentUserPos = { lat, lng };

      if (!userMarker) {
        userMarker = L.circleMarker([lat, lng], {
          radius: 8,
          fillColor: "#2563eb",
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map).bindPopup("あなたの現在地");

        // 半径2mの判定エリア円
        userRangeCircle = L.circle([lat, lng], {
          radius: 2.0,
          color: "#2563eb",
          fillColor: "#3b82f6",
          fillOpacity: 0.2,
          weight: 1
        }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lng]);
        userRangeCircle.setLatLng([lat, lng]);
      }

      if (firstGpsFix || centerMap) {
        map.setView([lat, lng], 18);
        firstGpsFix = false;
        loadPlaces();
      }
    }

    // 自動追尾（watchPosition）
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          updateUserLocation(pos.coords.latitude, pos.coords.longitude, false);
        },
        (err) => {
          console.warn("GPSエラー:", err);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 3000,
          timeout: 10000
        }
      );
    }

    // =====================================
    // 現在地取得ボタンのクリック処理
    // =====================================
    locateButton.addEventListener("click", () => {
      if (!("geolocation" in navigator)) {
        return;
      }

      locateButton.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          locateButton.disabled = false;
          // 現在地を更新し、地図を現在地中心に移動して再検索
          updateUserLocation(pos.coords.latitude, pos.coords.longitude, true);
        },
        (err) => {
          locateButton.disabled = false;
          console.warn("現在地取得エラー:", err);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0, // ボタン押下時はキャッシュを使わず最新座標を取得
          timeout: 10000
        }
      );
    });

    // =====================================
    // 3. PHP APIから施設と2m範囲判定を取得
    // =====================================
    async function loadPlaces() {
      const thisRequest = ++requestNumber;
      const bounds = map.getBounds();

      const bbox = [
        bounds.getWest(),
        bounds.getSouth(),
        bounds.getEast(),
        bounds.getNorth()
      ].join(",");

      const params = new URLSearchParams({
        q: "観光",
        bbox: bbox
      });

      if (currentUserPos) {
        params.append("user_lat", currentUserPos.lat);
        params.append("user_lng", currentUserPos.lng);
      }

      try {
        const response = await fetch(`${API_URL}?${params.toString()}`);

        if (!response.ok) {
          throw new Error(`APIエラー: ${response.status}`);
        }

        const data = await response.json();
        if (thisRequest !== requestNumber) return;

        markers.clearLayers();
        const spots = data.spots || [];

        for (const spot of spots) {
          const marker = L.marker([spot.latitude, spot.longitude]);

          const popupContent = document.createElement("div");
          popupContent.className = "tourism-popup";

          // 観光地名
          const title = document.createElement("div");
          title.className = "tourism-title";
          title.textContent = spot.name;
          popupContent.appendChild(title);

          // 距離ステータス表示
          const distBadge = document.createElement("div");
          distBadge.style.fontSize = "12px";
          distBadge.style.margin = "4px 0 8px";

          if (spot.distance_m === null) {
            distBadge.style.color = "#64748b";
            distBadge.textContent = "現在地を取得中...";
          } else if (spot.is_within_range) {
            distBadge.style.color = "#15803d";
            distBadge.style.fontWeight = "bold";
            distBadge.textContent = `圏内OK！（現在地から ${spot.distance_m}m）`;
          } else {
            distBadge.style.color = "#b91c1c";
            distBadge.textContent = `あと ${(spot.distance_m - spot.allowed_radius_m).toFixed(1)}m 近づこう（現在 ${spot.distance_m}m）`;
          }
          popupContent.appendChild(distBadge);

          // クイズへ進むボタン
          const quizButton = document.createElement("button");
          quizButton.className = "tourism-quiz-button";
          quizButton.style.width = "100%";
          quizButton.style.padding = "6px 10px";
          quizButton.style.borderRadius = "6px";
          quizButton.style.border = "none";
          quizButton.style.fontWeight = "bold";

          if (spot.is_within_range) {
            quizButton.style.background = "#2563eb";
            quizButton.style.color = "#ffffff";
            quizButton.style.cursor = "pointer";
            quizButton.textContent = "クイズへ進む";

            quizButton.addEventListener("click", () => {
              const qParams = new URLSearchParams({
                spot_id: spot.spot_id,
                name: spot.name,
                lat: currentUserPos.lat,
                lng: currentUserPos.lng
              });
              location.href = `quiz.html?${qParams.toString()}`;
            });
          } else {
            quizButton.style.background = "#cbd5e1";
            quizButton.style.color = "#64748b";
            quizButton.style.cursor = "not-allowed";
            quizButton.textContent = `半径${spot.allowed_radius_m}m以内で挑戦可能`;
            quizButton.disabled = true;
          }
          popupContent.appendChild(quizButton);

          marker.bindPopup(popupContent, {
            className: "tourism-popup-container",
            maxWidth: 400,
            closeButton: false,
            autoPan: true
          });

          marker.addTo(markers);
        }

      } catch (error) {
        if (thisRequest !== requestNumber) return;
        console.error(error);
      }
    }

    // =====================================
    // 5. 地図を移動したとき再検索
    // =====================================
    let moveTimer;
    map.on("moveend", function () {
      clearTimeout(moveTimer);
      moveTimer = setTimeout(() => {
        loadPlaces();
      }, 350);
    });

    // =====================================
    // 6. 初回の施設取得
    // =====================================
    loadPlaces();
  </script>

  <!-- OpenPOI APIの出典 -->
  <footer style="display:none">
    <a href="https://openpoiapi.com/attribution.html">
      OpenPOI API
    </a>
  </footer>

</body>
</html>
