services:
  web:
    build: ./docker/php
    container_name: tryth-local-web
    ports:
      - "8000:80"
    volumes:
      - ./html:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: tryth-local-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tryth_db}
      MYSQL_USER: ${MYSQL_USER:-tryth_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tryth_pass}
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - db_local_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tryth-local-pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    depends_on:
      - db

volumes:
  db_local_data: